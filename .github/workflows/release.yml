name: Release

# Publishes to npm via TRUSTED PUBLISHING (OIDC) when a GitHub Release is
# published — no npm token, no secret to rotate. Provenance is attested
# automatically.
#
# One-time setup (npm can't trust-publish a package that doesn't exist yet):
#   1. Publish v1 ONCE to create the package — easiest from your machine:
#        npm login && npm publish        (prepublishOnly runs the build)
#   2. npmjs.com → the package → Settings → Trusted Publisher → add
#      GitHub Actions: repo `TurtIeSocks/dot.paths`, workflow `release.yml`.
#   3. After that, every GitHub Release runs this workflow and publishes via
#      OIDC. Cut a release: bump "version" in package.json, tag, publish a
#      GitHub Release for the tag.
#
# Requirements (already met below): Node >= 22 + npm >= 11.5.1 (Node 24 ships
# it) and pnpm 10.x — pnpm fetches the OIDC token + provenance itself. NOTE:
# pnpm 11 currently has an OIDC publish regression (pnpm/pnpm#11513), so stay on
# the pinned pnpm 10.x in package.json "packageManager".
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets pnpm exchange the GitHub OIDC token with npm (auth + provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version is read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # >= 22 required for OIDC; 24 LTS ships npm >= 11.5.1
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gate the publish on the same checks as CI.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # No NODE_AUTH_TOKEN: with `id-token: write` set, pnpm authenticates via
      # OIDC trusted publishing and attaches provenance automatically.
      - name: Publish to npm (OIDC trusted publishing)
        run: pnpm publish --no-git-checks --provenance --access public
